# Supabase CLI configuration for the local stack, CI and E2E (`supabase start`).
# Keys checked against `supabase init` output of CLI 2.122.1 (P3). Unlisted settings use CLI
# defaults. Hosted-project auth settings are configured separately (docs/DEPLOYMENT.md §6).
project_id = "ai-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project (verified against the Supabase dev project in P2).
major_version = 17

[db.seed]
# Local demo data only. Never applied to the dev or production project.
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

# Local mail catcher (Mailpit). Auth emails (confirm, magic link, reset) land here; E2E reads them
# through its HTTP API on port 54324.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
# Dashboard origin (Vite dev + preview both run on 5173 locally).
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# Mirrored in packages/shared/src/auth.ts (PASSWORD_RULES) so the UI validates the same way.
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
# Local/CI only: the E2E journey sends several confirmation emails within an hour.
email_sent = 60
sign_in_sign_ups = 60
token_verifications = 60

[auth.email]
enable_signup = true
double_confirm_changes = true
# Email verification is required before the first sign-in (P3 scope).
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Google sign-in (E8): off unless configured. The dashboard hides the button unless
# VITE_AUTH_GOOGLE_ENABLED=true. Env names from the Supabase Google guide (DEPLOYMENT.md §6).
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Optional local secrets for functions (unset = feature reports "not configured").
[edge_runtime.secrets]
APP_URL = "env(APP_URL)"
RESEND_API_KEY = "env(RESEND_API_KEY)"
RESEND_FROM_EMAIL = "env(RESEND_FROM_EMAIL)"

# `api` verifies the caller itself (_shared/auth.ts → Auth `getUser`), because a few routes are
# public (health, invitation preview). Docs: guides/functions/auth-headers (checked 2026-11-26).
[functions.api]
verify_jwt = false

[analytics]
enabled = false
