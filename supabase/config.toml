# Supabase CLI configuration for the local stack and CI (`supabase db start` + `supabase test db`).
# Written by hand (the CLI was not installable in the P2 sandbox); keys are limited to ones the
# CLI v2 documents. Unlisted settings use CLI defaults. See docs/DEPLOYMENT.md.
project_id = "ai-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project (verified against the Supabase dev project in P2).
major_version = 17

[db.seed]
# Local demo data only. Never applied to the dev or production project.
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
