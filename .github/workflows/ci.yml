name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  # Migrations + pgTAP RLS suite on the real Supabase local stack (P2 exit criterion).
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start Postgres and apply migrations + seed
        run: supabase db start
      - name: pgTAP suites
        run: supabase test db
      - name: plpgsql lint
        run: supabase db lint --level error
  # Later phases add `deno lint/test` for supabase/functions (P3+) and Playwright E2E (P3/P16).
